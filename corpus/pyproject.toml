[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "litmus-corpus"
version = "1.2.0"
description = "The Litmus corpus pipeline: public human, model and mixed text to balanced parquet shards"
requires-python = ">=3.12"
# Exact pins name the tested stack.
dependencies = [
    "datasets==5.0.1",
    "fasttext-wheel==0.9.2",
    "httpx==0.28.1",
    "huggingface-hub==1.32.0",
    "numpy==2.5.3",
    "pyarrow==25.0.1",
    "tokenizers==0.23.2",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
