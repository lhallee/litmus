<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img">
<title>The training pipeline from public sources to the released model</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><linearGradient id="strip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F6FDB"/><stop offset="0.5" stop-color="#8E5BC9"/><stop offset="1" stop-color="#D9483B"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9B2C6" stroke-width="2" stroke-opacity="0.5"/></pattern></defs>
<rect width="1280" height="470" rx="24" fill="#17151D"/>
<rect x="50" y="40" width="265" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/>
<text x="68" y="74" font-size="20" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">1  </tspan>Sources</text>
<text x="68" y="104" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">public datasets</text>
<text x="68" y="127" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">pinned by revision</text>
<text x="68" y="150" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">nothing generated</text>
<rect x="355" y="40" width="265" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/>
<text x="373" y="74" font-size="20" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">2  </tspan>Corpus</text>
<text x="373" y="104" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">read raw, standardize</text>
<text x="373" y="127" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">passages, checks</text>
<text x="373" y="150" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">hold out, balance</text>
<rect x="660" y="40" width="265" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/>
<text x="678" y="74" font-size="20" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">3  </tspan>Embed</text>
<text x="678" y="104" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">frozen ModernBERT-base</text>
<text x="678" y="127" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">mean and variance</text>
<text x="678" y="150" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">of last states</text>
<rect x="965" y="40" width="265" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/>
<text x="983" y="74" font-size="20" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">4  </tspan>Split</text>
<text x="983" y="104" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">e-means clusters</text>
<text x="983" y="127" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">whole clusters to sets</text>
<text x="983" y="150" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">moats between sets</text>
<rect x="50" y="270" width="265" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/>
<text x="68" y="304" font-size="20" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">8  </tspan>Engine</text>
<text x="68" y="334" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">one CPU core</text>
<text x="68" y="357" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">same numbers as</text>
<text x="68" y="380" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">the Python reference</text>
<rect x="355" y="270" width="265" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/>
<text x="373" y="304" font-size="20" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">7  </tspan>Release</text>
<text x="373" y="334" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">ternary weights, bank,</text>
<text x="373" y="357" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">calibration table</text>
<rect x="660" y="270" width="265" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/>
<text x="678" y="304" font-size="20" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">6  </tspan>Bank and calibration</text>
<text x="678" y="334" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">reference vectors</text>
<text x="678" y="357" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">per-length tables</text>
<rect x="965" y="270" width="265" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/>
<text x="983" y="304" font-size="20" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">5  </tspan>Train</text>
<text x="983" y="334" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">ternary encoder</text>
<text x="983" y="357" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">pair loss on labels</text>
<text x="983" y="380" font-size="15.5" font-weight="400" fill="#B9B2C6" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">chosen on validation</text>
