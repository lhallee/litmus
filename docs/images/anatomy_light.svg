<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img">
<title>The parts of a Litmus reading</title>
<defs><linearGradient id="strip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F6FDB"/><stop offset="0.5" stop-color="#8E5BC9"/><stop offset="1" stop-color="#D9483B"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1280" height="560" rx="24" fill="#F4EFE6"/>
<rect x="40" y="30" width="720" height="500" rx="16" fill="#FFFDF8" stroke="#D8CFC0" stroke-width="1.5"/><circle cx="82" cy="88" r="16" fill="none" stroke="#8E5BC9" stroke-width="6"/><text x="112" y="102" font-size="36" font-weight="600" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Uncertain: human or mixed</text><text x="66" y="140" font-size="17" fill="#5A5363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">It could be human or mixed; the reading cannot tell them apart. AI is ruled out.</text><rect x="66" y="172" width="668" height="24" rx="12.0" fill="url(#strip)"/><rect x="66.0" y="167" width="334.0" height="34" rx="6" fill="#C9B8E6" fill-opacity="0.35" stroke="#8E5BC9" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="262.4" y="163" width="8" height="42" rx="4" fill="#1E1A24" stroke="#F4EFE6" stroke-width="2"/><text x="66" y="226" font-size="15" fill="#2F5FB8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Human</text><text x="400.0" y="226" font-size="15" fill="#6E3FAA" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Mixed</text><text x="734" y="226" font-size="15" fill="#B2362B" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">AI</text><text x="66" y="266" font-size="15" font-weight="600" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Your text</text><rect x="62" y="288" width="576.0" height="28" rx="4" fill="#2F6FDB" fill-opacity="0.22"/><text x="68" y="308" font-size="17" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">The bakery on the corner opens at six, which is earlier than</text><rect x="62" y="322" width="595.1999999999999" height="28" rx="4" fill="#2F6FDB" fill-opacity="0.22"/><text x="68" y="342" font-size="17" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">anything else on the street. By the time the bus shelter fills</text><rect x="62" y="356" width="604.8" height="28" rx="4" fill="#2F6FDB" fill-opacity="0.22"/><text x="68" y="376" font-size="17" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">up, there is already a short line of people holding paper cups.</text><rect x="62" y="390" width="604.8" height="28" rx="4" fill="#8E5BC9" fill-opacity="0.22"/><text x="68" y="410" font-size="17" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Last spring the city repaved the road and closed the corner for</text><rect x="62" y="424" width="604.8" height="28" rx="4" fill="#8E5BC9" fill-opacity="0.22"/><text x="68" y="444" font-size="17" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">three weeks, and sales fell by half. Instead of waiting it out,</text><rect x="62" y="458" width="508.79999999999995" height="28" rx="4" fill="#D9483B" fill-opacity="0.22"/><text x="68" y="478" font-size="17" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">she put a folding table at the far end of the detour.</text><path d="M680 88 L820 88" stroke="#8A8090" stroke-width="1.5" fill="none"/><circle cx="680" cy="88" r="4" fill="#8A8090"/><circle cx="836" cy="88" r="15" fill="#FFFDF8" stroke="#8A8090" stroke-width="1.5"/><text x="836" y="94" font-size="16" font-weight="600" fill="#1E1A24" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">1</text><text x="864" y="95" font-size="21" font-weight="600" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Verdict</text><text x="864" y="121" font-size="16" fill="#5A5363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">the origins the reading cannot rule out</text><text x="864" y="143" font-size="16" fill="#5A5363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">at the 10% level: one, two, three, or none</text><path d="M560 184 L820 184" stroke="#8A8090" stroke-width="1.5" fill="none"/><circle cx="560" cy="184" r="4" fill="#8A8090"/><circle cx="836" cy="184" r="15" fill="#FFFDF8" stroke="#8A8090" stroke-width="1.5"/><text x="836" y="190" font-size="16" font-weight="600" fill="#1E1A24" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">2</text><text x="864" y="191" font-size="21" font-weight="600" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Strip and mark</text><text x="864" y="217" font-size="16" fill="#5A5363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">where the reading falls from human</text><text x="864" y="239" font-size="16" fill="#5A5363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">(blue) through mixed to AI (red)</text><path d="M340 190 L820 262" stroke="#8A8090" stroke-width="1.5" fill="none"/><circle cx="340" cy="190" r="4" fill="#8A8090"/><circle cx="836" cy="262" r="15" fill="#FFFDF8" stroke="#8A8090" stroke-width="1.5"/><text x="836" y="268" font-size="16" font-weight="600" fill="#1E1A24" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">3</text><text x="864" y="269" font-size="21" font-weight="600" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Pale band</text><text x="864" y="295" font-size="16" fill="#5A5363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">covers every origin still in the set,</text><text x="864" y="317" font-size="16" fill="#5A5363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">so a wide band is an unsure reading</text><path d="M680 410 L820 400" stroke="#8A8090" stroke-width="1.5" fill="none"/><circle cx="680" cy="410" r="4" fill="#8A8090"/><circle cx="836" cy="400" r="15" fill="#FFFDF8" stroke="#8A8090" stroke-width="1.5"/><text x="836" y="406" font-size="16" font-weight="600" fill="#1E1A24" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">4</text><text x="864" y="407" font-size="21" font-weight="600" fill="#1E1A24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Heat map</text><text x="864" y="433" font-size="16" fill="#5A5363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">tints the text where the reading changes;</text><text x="864" y="455" font-size="16" fill="#5A5363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">the verdict, not one cell, decides</text>
</svg>
