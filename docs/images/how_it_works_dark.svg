<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img">
<title>How a Litmus reading is made</title>
<defs><linearGradient id="strip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F6FDB"/><stop offset="0.5" stop-color="#8E5BC9"/><stop offset="1" stop-color="#D9483B"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1280" height="440" rx="24" fill="#17151D"/>
<rect x="60" y="40" width="240" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/><text x="78" y="74" font-size="21" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">1  </tspan>Your text</text><text x="78" y="104" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">any length, any format</text><text x="78" y="128" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">read on your machine</text><text x="78" y="152" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">or in the browser page</text><rect x="360" y="40" width="260" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/><text x="378" y="74" font-size="21" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">2  </tspan>Ternary encoder</text><text x="378" y="104" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">BitNet b1.58 student</text><text x="378" y="128" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">every weight is -1, 0, or +1</text><text x="378" y="152" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">integer additions on the CPU</text><rect x="680" y="40" width="230" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/><text x="698" y="74" font-size="21" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">3  </tspan>Text vector</text><text x="698" y="104" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">mean and variance</text><text x="698" y="128" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">of the token vectors</text><text x="698" y="152" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">long texts in chunks</text><rect x="970" y="40" width="250" height="150" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/><text x="988" y="74" font-size="21" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">4  </tspan>Pair head</text><text x="988" y="104" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">same origin or not?</text><text x="988" y="128" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">a query and a key</text><text x="988" y="152" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">for every pair</text><rect x="970" y="240" width="250" height="160" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/><text x="988" y="274" font-size="21" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">5  </tspan>Reference bank</text><text x="988" y="304" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">known texts, as vectors</text><rect x="620" y="240" width="290" height="160" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/><text x="638" y="274" font-size="21" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">6  </tspan>Calibration</text><text x="638" y="304" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">held-out texts of each length</text><text x="638" y="328" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">conformal p-value per origin</text><text x="638" y="352" font-size="16" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Venn-Abers probability</text><rect x="60" y="240" width="500" height="160" rx="14" fill="#221F2A" stroke="#3A3545" stroke-width="1.5"/><text x="78" y="274" font-size="21" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><tspan fill="#B9B2C6" font-weight="400">7  </tspan>Calibrated reading</text><rect x="988" y="332" width="64" height="44" rx="8" fill="#2F6FDB" fill-opacity="0.9"/><text x="1020" y="360" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">human</text><rect x="1060" y="332" width="64" height="44" rx="8" fill="#8E5BC9" fill-opacity="0.9"/><text x="1092" y="360" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">mixed</text><rect x="1132" y="332" width="64" height="44" rx="8" fill="#D9483B" fill-opacity="0.9"/><text x="1164" y="360" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">AI</text><text x="78" y="306" font-size="18" font-weight="600" fill="#F2EEF7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Uncertain: human or mixed</text><text x="78" y="330" font-size="15" fill="#B9B2C6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">the origins not ruled out, and the chance of AI with its range</text><rect x="78" y="352" width="462" height="16" rx="8.0" fill="url(#strip)"/><rect x="78.0" y="347" width="240.24" height="26" rx="6" fill="#C9B8E6" fill-opacity="0.35" stroke="#C9B8E6" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="184.88" y="343" width="8" height="34" rx="4" fill="#F2EEF7" stroke="#17151D" stroke-width="2"/><path d="M300 115 L354 115" fill="none" stroke="#8E86A0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620 115 L674 115" fill="none" stroke="#8E86A0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M910 115 L964 115" fill="none" stroke="#8E86A0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1095 190 L1095 234" fill="none" stroke="#8E86A0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M970 320 L916 320" fill="none" stroke="#8E86A0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620 320 L566 320" fill="none" stroke="#8E86A0" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
