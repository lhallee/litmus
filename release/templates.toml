# Sentences and tables of the documents that are made of values from the release's data. A slot `<!--litmus:t:name-->`
# holds the template `name`. A template is text with `{path as format}` fields (release/litmus_release/datapath.py says what
# a path and a format are); a line that starts `@if path ` stays only when the path holds a value, so a recipe without a
# teacher drops the teacher's rows. A template `{ if, then, else }` picks its text by whether a path holds a value.
# The documents carry the prose around a slot; the prose is the author's, the numbers are the data's.

latest_release_link = "[the latest release](https://github.com/{target.github.repo}/releases/latest)"
hub_model_link = "https://huggingface.co/{target.hub.model_repo}"
data_files = "the release's [`results.json`]({release.page})"
release_identity = "`{release.tag}` (model {release.model_repo} at commit {release.model_revision})"
released_size = "`{model.config_name}` (width {model.width}, {model.depth} layers, {model.ternary_weights as m2} ternary weights)"
head_widths = "hidden width {config.head.hidden}, output width {config.head.out_width}"
bank_counts = "{model.bank.human as int} human, {model.bank.ai as int} AI, and {model.bank.mixed as int} mixed"
attention_use = "the release's `model.attention` is `{model.attention}`"
output_use = "the release's `model.output` is `{model.output}`"
# The texts the table was fitted on are the table's own counts: the calibration split without its long documents,
