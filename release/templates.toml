# The range of the chance of AI. `ranges` is what the programs print for a chance, made from the release's calibration
# table (`config.calibration.between_sources`: how far the chance moves between sources); `chance_range` is the record's
# file of the fit's checks, with sources left out and on the test passages.
chance_range_example = "50% ({ranges.at_50_low}-{ranges.at_50_high}%)"
chance_range_sources = "{ranges.human_sources} human sources and {ranges.not_human_sources} AI and mixed sources"
chance_range_rule = "{ranges.level_percent}% of the pairings of one human source with one AI or mixed source, which is {ranges.odds as f1} times the odds in either direction"
chance_range_log_odds = "{config.calibration.between_sources.log_odds as f2} log odds, {ranges.odds as f1} times the odds"
chance_range_table = '''
| Chance of AI | Its range |
| --- | --- |
| 5% | {ranges.at_5_low}% to {ranges.at_5_high}% |
| 20% | {ranges.at_20_low}% to {ranges.at_20_high}% |
| 50% | {ranges.at_50_low}% to {ranges.at_50_high}% |
