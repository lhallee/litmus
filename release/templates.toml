chance_range_test = "On the {chance_range.test.passages as int} test passages, read once after the rule was fixed, {chance_range.test.worlds_inside as pct0} of the pairings of test sources fell inside the range"
chance_range_largest_source = "{chance_range.calibration.largest_source.texts as int} of the {chance_range.calibration.texts as int} calibration texts ({chance_range.calibration.largest_source.share as pct0}), and {chance_range.calibration.largest_source.not_human_share as pct0} of its AI and mixed texts"

# The README's speed line. The app reads a text on every logical processor, so once the bench stage has measured the
# document that way the line says so; a measurement made before that keeps the one-core line.
speed_summary = { if = "bench.document_all_processors", then = "On one CPU core the app reads ~{results.release.app_tokens_per_second as sig2} tokens (pieces of words) a second, on the {bench.document_all_processors.threads as int} logical processors of the same machine ~{bench.document_all_processors.text_tokens_per_second as sig2}, and the browser page ~{results.release.browser_tokens_per_second as sig2}.", else = "On one CPU core the app reads ~{results.release.app_tokens_per_second as sig2} tokens (pieces of words) a second, and the browser page ~{results.release.browser_tokens_per_second as sig2}." }

speed_sentence = "on one processor core ({bench.machine.name}), reading a {bench.document.tokens as int}-token document, the app read about {results.release.app_tokens_per_second as int} tokens (word pieces) a second and the browser page about {results.release.browser_tokens_per_second as int} ({browser.browser}, {browser.threads} worker), so the document took about {results.release.app_document_seconds as f1} seconds in the app and about {results.release.browser_document_seconds as f1} in the page"

speed_paragraph = "The released size (`{model.config_name}`) reads {bench.rows[tokens=8192].text_tokens_per_second as int} tokens per second on an 8,192-token text with a process peak of {bench.rows[tokens=8192].process_peak_bytes as mb1}, on {bench.machine.name} under {bench.machine.system} (one core, {bench.machine.backend} kernels). Its release files are {model.files_bytes as mb1}, and its single-core cost is {results.costs[detector=Litmus engine].seconds_per_1k_words as ms0} ms per 1,000 words on one core of {counts.speed_machine}, beside the other detectors in the benchmark tables (timed on one core of {counts.other_speed_machines})."

