[workspace]
members = ["litmus-engine", "litmus-files", "litmus-cli", "litmus-py"]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.91"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
